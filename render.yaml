services:
  - type: web
    name: biovostok
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: echo "=== MIGRATE ===" && python manage.py migrate --noinput --verbosity 3 && echo "=== COLLECTSTATIC ===" && python manage.py collectstatic --noinput --no-post-process && echo "=== ADMIN ===" && python scripts/create_superuser.py && echo "=== START ===" && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: biovostok-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "biovostok.onrender.com,localhost,127.0.0.1"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

databases:
  - name: biovostok-db
    databaseName: biovostok
    plan: free