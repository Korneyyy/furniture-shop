{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark bg-opacity-75 text-white">
                <div class="card-header text-center">
                    <h3>{% trans "Регистрация" %}</h3>
                </div>
                <div class="card-body">
                    <form method="post" class="text-center">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-success w-100">{% trans "Зарегистрироваться" %}</button>
                    </form>
                    <div class="mt-3 text-center">
                        <a href="{% url 'users:login' %}" class="text-white-50">{% trans "Уже есть аккаунт? Войти" %}</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
