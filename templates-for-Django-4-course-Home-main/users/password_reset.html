{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark bg-opacity-75 text-white">
                <div class="card-header text-center">
                    <h3>{% trans "Восстановление пароля" %}</h3>
                </div>
                <div class="card-body">
                    <p class="text-center text-white-50 mb-4">
                        {% trans "Введите ваш email, и мы отправим ссылку для сброса пароля." %}
                    </p>
                    <form method="post" class="text-center">
                        {% csrf_token %}
                        <div class="mb-3">
                            <input type="email" name="email" class="form-control" placeholder="{% trans "Email" %}" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">{% trans "Отправить" %}</button>
                    </form>
                    <div class="mt-3 text-center">
                        <a href="{% url 'users:login' %}" class="text-white-50">{% trans "Вернуться ко входу" %}</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
