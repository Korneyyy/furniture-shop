{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark bg-opacity-75 text-white">
                <div class="card-header text-center">
                    <h3>{% trans "Пароль изменён" %}</h3>
                </div>
                <div class="card-body text-center">
                    <p class="mb-4">{% trans "Ваш пароль успешно изменён." %}</p>
                    <a href="{% url 'users:login' %}" class="btn btn-success">{% trans "Войти" %}</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
