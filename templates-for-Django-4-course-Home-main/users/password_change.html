{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark bg-opacity-75 text-white">
                <div class="card-header text-center">
                    <h3>{% trans "Смена пароля" %}</h3>
                </div>
                <div class="card-body">
                    <form method="post" class="text-center">
                        {% csrf_token %}
                        <div class="mb-3">
                            <input type="password" name="old_password" class="form-control" placeholder="{% trans "Старый пароль" %}" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" name="new_password1" class="form-control" placeholder="{% trans "Новый пароль" %}" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" name="new_password2" class="form-control" placeholder="{% trans "Подтвердите пароль" %}" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">{% trans "Изменить пароль" %}</button>
                    </form>
                    <div class="mt-3 text-center">
                        <a href="{% url 'users:profile' %}" class="text-white-50">{% trans "Вернуться в профиль" %}</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
