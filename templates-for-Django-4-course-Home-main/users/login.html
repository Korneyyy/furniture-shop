{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark bg-opacity-75 text-white">
                <div class="card-header text-center">
                    <h3>{% trans "Вход" %}</h3>
                </div>
                <div class="card-body">
                    <form method="post" class="text-center">
                        {% csrf_token %}
                        <div class="mb-3">
                            <input type="text" name="username" class="form-control" placeholder="{% trans "Имя пользователя" %}" required>
                        </div>
                        <div class="mb-3">
                            <input type="password" name="password" class="form-control" placeholder="{% trans "Пароль" %}" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">{% trans "Войти" %}</button>
                    </form>
                    <div class="mt-3 text-center">
                        <a href="{% url 'users:password_reset' %}" class="text-white-50">{% trans "Забыли пароль?" %}</a>
                    </div>
                    <div class="mt-2 text-center">
                        <a href="{% url 'users:register' %}" class="text-white-50">{% trans "Нет аккаунта? Зарегистрироваться" %}</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
