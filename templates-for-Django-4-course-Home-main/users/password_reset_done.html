{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark bg-opacity-75 text-white">
                <div class="card-header text-center">
                    <h3>{% trans "Письмо отправлено" %}</h3>
                </div>
                <div class="card-body text-center">
                    <p class="mb-4">
                        {% trans "Мы отправили инструкцию по сбросу пароля на указанный email." %}
                    </p>
                    <p class="text-white-50">
                        {% trans "Если вы не получили письмо, проверьте папку «Спам»." %}
                    </p>
                    <a href="{% url 'users:login' %}" class="btn btn-success">{% trans "Вернуться ко входу" %}</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
